[project]
name = "workbench-api"
version = "0.1.0"
description = "AI Workbench control plane: visual project scaffolding, cloud resources, deploys and Agent/MCP/Skill management."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6.0",
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    # certificate parsing, CSRs and the ES256 JWS used by the ACME client; the
    # gateway works without it when only a wildcard certificate is configured
    "cryptography>=43.0",
    # the gateway proxies websocket upgrades (vite HMR); uvicorn[standard] brings
    # it in transitively, but we import it directly, so it is declared here
    "websockets>=13.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# templates.py embeds whole project files as string literals; breaking
# them reflows the generated files for no gain. pages.py embeds CSS.
# auth.py has an inline demo-IdP HTML page with CSS. conventions.py
# holds Chinese convention copy where the sentence is the unit.
"app/services/templates.py" = ["E501"]
"app/gateway/pages.py" = ["E501"]
"app/services/conventions.py" = ["E501"]
"app/api/auth.py" = ["E501"]
"app/providers/local/static_host.py" = ["E501"]
"tools/auth_smoke.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
